# dsh-plugin-tts bundle: register the Edge TTS voice plugin (host routes + client UI).
# config 为 TTS 默认项：voice = Edge TTS 音色代码；rate / pitch = SSML 语速/音调（+0% / +0Hz 表示不变）。
- insert:
    - id: tts
      name: '@memef1f1y/dsh-plugin-tts'
      config:
        voice: zh-CN-XiaoxuanNeural
        rate: '+0%'
        pitch: '+0Hz'
